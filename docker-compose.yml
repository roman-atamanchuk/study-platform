services:
  db:
    image: postgres:16-alpine
    container_name: study-platform-db
    environment:
      POSTGRES_DB: ${DB_NAME:-study_platform}
      POSTGRES_USER: ${DB_USER:-study_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-study_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-study_user} -d ${DB_NAME:-study_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-platform-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-study_platform}
      DB_USER: ${DB_USER:-study_user}
      DB_PASSWORD: ${DB_PASSWORD:-study_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      STORAGE_LOCAL_PATH: /app/storage
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    env_file:
      - .env
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-platform-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_DEV_LOGIN_HINT: ${VITE_DEV_LOGIN_HINT:-true}
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
