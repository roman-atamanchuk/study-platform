spring:
  datasource:
    url: jdbc:h2:mem:study_platform_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    locations: classpath:db/test-migration
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.session.autoconfigure.SessionAutoConfiguration

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  auth:
    expose-reset-token: true
  conversion:
    enabled: false
