spring:
  application:
    name: study-platform
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:study_platform}
    username: ${DB_USER:study_user}
    password: ${DB_PASSWORD:study_password}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    password-reset-ttl-hours: 24
    expose-reset-token: ${EXPOSE_RESET_TOKEN:false}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:storage}
  conversion:
    enabled: ${CONVERSION_ENABLED:true}
    libreoffice-path: ${LIBREOFFICE_PATH:libreoffice}
    timeout-seconds: ${CONVERSION_TIMEOUT_SECONDS:120}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
